[project]
name = "fyp-guardrail"
version = "0.1.0"
description = "Hybrid machine-learning guardrail against prompt injection for tool-using LLM agents (APU FYP, TP066836)"
readme = "README.md"
authors = [{ name = "Nye Wei Jun" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    # P2 - detection layer (rules + classical ML + transformer fine-tuning)
    "numpy",
    "pandas",
    "scikit-learn",
    "datasets",
    "transformers",
    "accelerate",
    "torch",
    "sentencepiece",
    "protobuf",
    "tensorboard>=2.21.0",
    # P3/P4 - agent, guardrail middleware, API
    "openai",
    "pydantic>=2",
    "jsonschema>=4.26.0",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "python-dotenv",
    # P5 - evaluation and figures
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrail", "domains", "agent", "api", "evaluation", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
